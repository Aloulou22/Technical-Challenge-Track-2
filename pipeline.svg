<svg width="100%" viewBox="0 0 680 780" role="img" xmlns="http://www.w3.org/2000/svg">
<title>eSteps Health — data pipeline</title>
<desc>Four-layer pipeline: raw sources, per-source cleaning, day fusion, and safe AI narrative</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size:14px; font-weight:600; fill:#2C2C2A; }
.ts { font-size:12px; font-weight:400; fill:#5F5E5A; }
.coral-fill { fill:#FAECE7; stroke:#993C1D; }
.coral-text { fill:#712B13; }
.teal-fill  { fill:#E1F5EE; stroke:#0F6E56; }
.teal-text  { fill:#085041; }
.purple-fill{ fill:#EEEDFE; stroke:#534AB7; }
.purple-text{ fill:#3C3489; }
.blue-fill  { fill:#E6F1FB; stroke:#185FA5; }
.blue-text  { fill:#0C447C; }
.green-fill { fill:#EAF3DE; stroke:#3B6D11; }
.green-text { fill:#27500A; }
.amber-fill { fill:#FAEEDA; stroke:#854F0B; }
.amber-text { fill:#633806; }
.gray-fill  { fill:#F1EFE8; stroke:#888780; }
.gray-text  { fill:#444441; }
.arr        { stroke:#888780; stroke-width:1; fill:none; }
.dashed     { stroke:#B4B2A9; stroke-width:0.5; stroke-dasharray:4 3; fill:none; }
</style>
</defs>

<!-- Labels -->
<text class="ts" x="340" y="22" text-anchor="middle" fill="#888780">Part A — raw sources (generate_data.py)</text>

<!-- Row 1: sources -->
<rect class="coral-fill" x="30" y="32" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th coral-text" x="120" y="54" text-anchor="middle" dominant-baseline="central">Insole CSV</text>
<text class="ts coral-text" x="120" y="72" text-anchor="middle" dominant-baseline="central">gaps · impossible spikes</text>

<rect class="teal-fill" x="250" y="32" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th teal-text" x="340" y="54" text-anchor="middle" dominant-baseline="central">Ring CSV</text>
<text class="ts teal-text" x="340" y="72" text-anchor="middle" dominant-baseline="central">+02:00 bug · missing nights</text>

<rect class="purple-fill" x="470" y="32" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th purple-text" x="560" y="54" text-anchor="middle" dominant-baseline="central">Watch CSV</text>
<text class="ts purple-text" x="560" y="72" text-anchor="middle" dominant-baseline="central">fraction SpO2 · dupes · drift</text>

<line class="arr" x1="120" y1="88" x2="120" y2="138" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="88" x2="340" y2="138" marker-end="url(#arrow)"/>
<line class="arr" x1="560" y1="88" x2="560" y2="138" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="130" text-anchor="middle" fill="#888780">Part B — per-source cleaning (pipeline.py)</text>

<!-- Row 2: cleaning -->
<rect class="coral-fill" x="30" y="140" width="180" height="72" rx="8" stroke-width="0.5"/>
<text class="th coral-text" x="120" y="162" text-anchor="middle" dominant-baseline="central">Outlier detection</text>
<text class="ts coral-text" x="120" y="180" text-anchor="middle" dominant-baseline="central">physio bounds → null</text>
<text class="ts coral-text" x="120" y="196" text-anchor="middle" dominant-baseline="central">IQR 3× → flag</text>

<rect class="teal-fill" x="250" y="140" width="180" height="72" rx="8" stroke-width="0.5"/>
<text class="th teal-text" x="340" y="162" text-anchor="middle" dominant-baseline="central">ring_daily()</text>
<text class="ts teal-text" x="340" y="180" text-anchor="middle" dominant-baseline="central">tz → local day</text>
<text class="ts teal-text" x="340" y="196" text-anchor="middle" dominant-baseline="central">wake attribution</text>

<rect class="purple-fill" x="470" y="140" width="180" height="72" rx="8" stroke-width="0.5"/>
<text class="th purple-text" x="560" y="162" text-anchor="middle" dominant-baseline="central">watch_daily()</text>
<text class="ts purple-text" x="560" y="180" text-anchor="middle" dominant-baseline="central">drop_duplicates · spo2×100</text>
<text class="ts purple-text" x="560" y="196" text-anchor="middle" dominant-baseline="central">drift flag if HR > 150</text>

<line class="arr" x1="120" y1="212" x2="120" y2="264"/>
<line class="arr" x1="340" y1="212" x2="340" y2="264"/>
<line class="arr" x1="560" y1="212" x2="560" y2="264"/>
<line class="arr" x1="120" y1="264" x2="560" y2="264"/>
<line class="arr" x1="340" y1="264" x2="340" y2="278" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="258" text-anchor="middle" fill="#888780">one row per patient-day</text>

<!-- Fusion box -->
<rect class="blue-fill" x="30" y="280" width="620" height="144" rx="10" stroke-width="0.5"/>
<text class="th blue-text" x="340" y="302" text-anchor="middle" dominant-baseline="central">build_patient() — day-by-day fusion loop</text>

<rect class="blue-fill" x="50"  y="316" width="130" height="88" rx="6" stroke="#185FA5" stroke-width="0.5"/>
<text class="th blue-text" x="115" y="344" text-anchor="middle" dominant-baseline="central">GAIT</text>
<text class="ts blue-text" x="115" y="362" text-anchor="middle" dominant-baseline="central">insole only</text>
<text class="ts blue-text" x="115" y="378" text-anchor="middle" dominant-baseline="central">never substitute</text>
<text class="ts blue-text" x="115" y="394" text-anchor="middle" dominant-baseline="central">null if no insole</text>

<rect class="blue-fill" x="198" y="316" width="130" height="88" rx="6" stroke="#185FA5" stroke-width="0.5"/>
<text class="th blue-text" x="263" y="344" text-anchor="middle" dominant-baseline="central">CARDIO</text>
<text class="ts blue-text" x="263" y="362" text-anchor="middle" dominant-baseline="central">ring > watch</text>
<text class="ts blue-text" x="263" y="378" text-anchor="middle" dominant-baseline="central">spo2 watch only</text>
<text class="ts blue-text" x="263" y="394" text-anchor="middle" dominant-baseline="central">log delta if both</text>

<rect class="blue-fill" x="346" y="316" width="130" height="88" rx="6" stroke="#185FA5" stroke-width="0.5"/>
<text class="th blue-text" x="411" y="344" text-anchor="middle" dominant-baseline="central">SLEEP</text>
<text class="ts blue-text" x="411" y="362" text-anchor="middle" dominant-baseline="central">ring only</text>
<text class="ts blue-text" x="411" y="378" text-anchor="middle" dominant-baseline="central">1-gap interpolate</text>
<text class="ts blue-text" x="411" y="394" text-anchor="middle" dominant-baseline="central">→ "partial"</text>

<rect class="blue-fill" x="494" y="316" width="130" height="88" rx="6" stroke="#185FA5" stroke-width="0.5"/>
<text class="th blue-text" x="559" y="344" text-anchor="middle" dominant-baseline="central">LOAD</text>
<text class="ts blue-text" x="559" y="362" text-anchor="middle" dominant-baseline="central">watch only</text>
<text class="ts blue-text" x="559" y="378" text-anchor="middle" dominant-baseline="central">null on drift day</text>
<text class="ts blue-text" x="559" y="394" text-anchor="middle" dominant-baseline="central">→ "partial"</text>

<line class="arr" x1="340" y1="424" x2="340" y2="458" marker-end="url(#arrow)"/>

<!-- Pydantic -->
<rect class="gray-fill" x="170" y="460" width="340" height="52" rx="8" stroke-width="0.5"/>
<text class="th gray-text" x="340" y="480" text-anchor="middle" dominant-baseline="central">pydantic validation</text>
<text class="ts gray-text" x="340" y="498" text-anchor="middle" dominant-baseline="central">rejects silent NaN · quality: ok | partial | missing</text>

<line class="arr" x1="340" y1="512" x2="340" y2="546" marker-end="url(#arrow)"/>

<!-- PatientDailySummary -->
<rect class="green-fill" x="130" y="548" width="440" height="52" rx="8" stroke-width="0.5"/>
<text class="th green-text" x="350" y="568" text-anchor="middle" dominant-baseline="central">PatientDailySummary JSON</text>
<text class="ts green-text" x="350" y="586" text-anchor="middle" dominant-baseline="central">versioned · source-tagged · quality-flagged · no silent NaNs</text>

<line class="arr" x1="350" y1="600" x2="350" y2="628" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="622" text-anchor="middle" fill="#888780">Part C — safe AI narrative (narrative.py)</text>

<!-- Narrative chain -->
<rect class="amber-fill" x="30"  y="634" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th amber-text" x="95"  y="656" text-anchor="middle" dominant-baseline="central">_scrub()</text>
<text class="ts amber-text" x="95"  y="674" text-anchor="middle" dominant-baseline="central">strip PHI</text>

<rect class="amber-fill" x="178" y="634" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th amber-text" x="243" y="656" text-anchor="middle" dominant-baseline="central">_coverage()</text>
<text class="ts amber-text" x="243" y="674" text-anchor="middle" dominant-baseline="central">cap confidence</text>

<rect class="amber-fill" x="326" y="634" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th amber-text" x="391" y="656" text-anchor="middle" dominant-baseline="central">LLM call</text>
<text class="ts amber-text" x="391" y="674" text-anchor="middle" dominant-baseline="central">JSON only · abstain ok</text>

<rect class="amber-fill" x="474" y="634" width="176" height="56" rx="8" stroke-width="0.5"/>
<text class="th amber-text" x="562" y="656" text-anchor="middle" dominant-baseline="central">_verify_grounding()</text>
<text class="ts amber-text" x="562" y="674" text-anchor="middle" dominant-baseline="central">check every value</text>

<line class="arr" x1="160" y1="662" x2="176" y2="662" marker-end="url(#arrow)"/>
<line class="arr" x1="308" y1="662" x2="324" y2="662" marker-end="url(#arrow)"/>
<line class="arr" x1="456" y1="662" x2="472" y2="662" marker-end="url(#arrow)"/>

<line class="arr" x1="562" y1="690" x2="562" y2="716"/>
<line class="arr" x1="562" y1="716" x2="350" y2="716"/>
<line class="arr" x1="350" y1="716" x2="350" y2="728" marker-end="url(#arrow)"/>

<!-- NarrativeOutput -->
<rect class="green-fill" x="130" y="730" width="440" height="36" rx="8" stroke-width="0.5"/>
<text class="th green-text" x="350" y="752" text-anchor="middle" dominant-baseline="central">NarrativeOutput JSON — grounded · validated · PHI-free</text>

<!-- Edge case callouts -->
<rect class="dashed" x="30" y="480" width="118" height="36" rx="6"/>
<text class="ts" x="89" y="494" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">non-wear day</text>
<text class="ts" x="89" y="508" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">gait → missing</text>
<line class="dashed" x1="148" y1="493" x2="168" y2="486"/>

<rect class="dashed" x="532" y="480" width="118" height="36" rx="6"/>
<text class="ts" x="591" y="494" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">drift day</text>
<text class="ts" x="591" y="508" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">watch → discarded</text>
<line class="dashed" x1="532" y1="493" x2="512" y2="486"/>

</svg>
